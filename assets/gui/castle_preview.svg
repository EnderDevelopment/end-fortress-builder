  <rect x="41" y="2" width="1" height="1" fill="#9ab8ff"/>
  <rect x="49" y="4" width="1" height="1" fill="#7ea0e0"/>
  <rect x="56" y="2" width="1" height="1" fill="#9ab8ff"/>
