  <rect x="52" y="21" width="3" height="4" fill="#00e5ff"/>
  <rect x="49" y="31" width="3" height="4" fill="#00e5ff"/>
  <rect x="52" y="41" width="3" height="4" fill="#00e5ff"/>
  <rect x="48" y="15" width="8" height="1" fill="#0066ff"/>

