  <rect x="0" y="59" width="64" height="5" fill="#0a1626"/>

  <!-- Main keep -->
  <rect x="20" y="20" width="24" height="38" fill="#181830"/>
  <rect x="20" y="20" width="24" height="1" fill="#00b8ff"/>
  <rect x="20" y="28" width="24" height="1" fill="#00b8ff"/>
  <rect x="20" y="36" width="24" height="1" fill="#00b8ff"/>
